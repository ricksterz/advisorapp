<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0d0d" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta
      name="description"
      content="Open Disclosure benchmarks every SEC-registered investment adviser — AUM, fees, client mix, and disciplinary history — with a transparent, customizable methodology built entirely from public Form ADV filings."
    />
    <title>Open Disclosure — SEC Form ADV adviser benchmarking</title>

    <link rel="canonical" href="https://open-disclosure.com/" />

    <!-- Open Graph -->
    <meta property="og:title" content="Open Disclosure — SEC Form ADV adviser benchmarking" />
    <meta
      property="og:description"
      content="Benchmark every SEC-registered investment adviser — AUM, fees, client mix, and disciplinary history — with a transparent, customizable methodology built from public Form ADV filings."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://open-disclosure.com/" />
    <meta property="og:image" content="https://open-disclosure.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Open Disclosure — SEC Form ADV adviser benchmarking" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Open Disclosure — SEC Form ADV adviser benchmarking" />
    <meta
      name="twitter:description"
      content="Benchmark every SEC-registered investment adviser — AUM, fees, client mix, and disciplinary history — from public Form ADV filings."
    />
    <meta name="twitter:image" content="https://open-disclosure.com/og-image.png" />

    <!-- Google Dataset Search: the underlying Form ADV dataset -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Dataset",
        "name": "Open Disclosure — SEC-registered investment adviser dataset",
        "description": "Structured data on every SEC-registered investment advisory firm, derived from public Form ADV Part 1A filings: regulatory assets under management (discretionary and non-discretionary), advisory headcount, client type mix, fee and compensation structure, financial-industry affiliations, and Item 11 disciplinary disclosure counts. Refreshed from the SEC's IAPD bulk compilation.",
        "url": "https://open-disclosure.com/",
        "keywords": [
          "SEC Form ADV",
          "investment adviser",
          "RIA",
          "regulatory assets under management",
          "IAPD",
          "adviser disciplinary disclosures"
        ],
        "license": "https://www.sec.gov/privacy#dissemination",
        "isAccessibleForFree": true,
        "creator": {
          "@type": "Organization",
          "name": "Open Disclosure",
          "url": "https://open-disclosure.com/"
        },
        "sourceOrganization": {
          "@type": "GovernmentOrganization",
          "name": "U.S. Securities and Exchange Commission",
          "url": "https://www.sec.gov/"
        },
        "distribution": {
          "@type": "DataDownload",
          "encodingFormat": "application/json",
          "contentUrl": "https://open-disclosure.com/firms.json"
        }
      }
    </script>

    <script>
      // Consolidate to the canonical domain — old GitHub Pages links (and
      // the site's own SPA-fallback 404.html) keep working, just redirected.
      if (window.location.hostname === 'ricksterz.github.io') {
        var path = window.location.pathname.replace(/^\/advisorapp\/?/, '/')
        window.location.replace(
          'https://open-disclosure.com' + path + window.location.search + window.location.hash,
        )
      }
    </script>
    <script>
      // Apply the saved theme before first paint to avoid a flash (dark is default).
      document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark'
    </script>
    <script type="module">
      // Analytics — production builds only; local dev never reports.
      if (import.meta.env.PROD) {
        // Cloudflare Web Analytics (privacy-friendly, no cookies), gated on
        // the token — see README "Deployment" for VITE_CF_ANALYTICS_TOKEN.
        if (import.meta.env.VITE_CF_ANALYTICS_TOKEN) {
          const beacon = document.createElement('script')
          beacon.defer = true
          beacon.src = 'https://static.cloudflareinsights.com/beacon.min.js'
          beacon.dataset.cfBeacon = JSON.stringify({
            token: import.meta.env.VITE_CF_ANALYTICS_TOKEN,
          })
          document.head.appendChild(beacon)
        }

        // Google Analytics 4. The measurement ID is public by nature (it
        // appears in the served page source regardless), so it lives here
        // rather than in build config. Enhanced measurement's history-change
        // detection covers the app's pushState routing automatically.
        const GA_ID = 'G-GYN9JCX9QR'
        const gtagScript = document.createElement('script')
        gtagScript.async = true
        gtagScript.src = `https://www.googletagmanager.com/gtag/js?id=${GA_ID}`
        document.head.appendChild(gtagScript)
        window.dataLayer = window.dataLayer || []
        window.gtag = function gtag() {
          window.dataLayer.push(arguments)
        }
        window.gtag('js', new Date())
        window.gtag('config', GA_ID)
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
