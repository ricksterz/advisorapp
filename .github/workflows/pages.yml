name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Monthly data refresh (only picks up new data when ADV_COMPILATION_URL is set)
    - cron: "0 6 5 * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build analytics database
        env:
          # Optional repository variable pinning an exact IA_ADV_Base
          # compilation zip URL. When unset, the latest bulk file is resolved
          # automatically from the SEC's Form ADV data index; the sample
          # fixture is the last resort so the site always deploys.
          ADV_COMPILATION_URL: ${{ vars.ADV_COMPILATION_URL }}
        run: |
          if [ -n "$ADV_COMPILATION_URL" ]; then
            python -m etl.ingest_adv --url "$ADV_COMPILATION_URL" --db data/advisor.duckdb
          elif python -m etl.fetch_latest --dest data/raw/latest_adv.xml.gz; then
            python -m etl.ingest_adv --input data/raw/latest_adv.xml.gz --db data/advisor.duckdb
            # Real bulk data means thousands of firms; a tiny count signals a
            # broken column mapping or a wrong file, so fail loudly.
            python -c "
          import duckdb, sys
          n = duckdb.connect('data/advisor.duckdb', read_only=True).execute('SELECT count(*) FROM firms').fetchone()[0]
          print(f'{n} firms loaded from bulk data')
          sys.exit(0 if n >= 1000 else f'error: only {n} firms parsed from real bulk data')
          "
          else
            echo "Could not resolve bulk data - building from sample fixture"
            python -m etl.ingest_adv --input etl/tests/fixtures/sample_adv_base.csv --db data/advisor.duckdb
          fi

      - name: Export static data for the frontend
        run: python -m etl.export_json --db data/advisor.duckdb --out frontend/public/firms.json

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          # GitHub Pages serves from a subpath; history-API routes need it baked in.
          BASE_PATH: /advisorapp/
        run: |
          npm ci
          npm run build

      - name: SPA fallback, sitemap, robots.txt
        run: |
          # Pages has no SPA rewrite; a 404.html copy of index.html makes
          # cold loads of /firm/:crd work.
          cp frontend/dist/index.html frontend/dist/404.html
          python -m etl.gen_sitemap --data frontend/public/firms.json \
            --site https://open-disclosure.com --out frontend/dist

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
